<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DR Task Counter</title>
    <style>
        :root {
            --bg-main: #0b131d;
            --bg-card: #131f2e;
            --border-color: #22344a;
            --accent-cyan: #38bdf8;
            --accent-indigo: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            margin: 0;
            min-height: 100vh;
        }

        .app-header {
            text-align: center;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 18px;
            letter-spacing: 3px;
            color: #cbd5e1;
            margin: 0 0 10px 0;
            text-transform: uppercase;
        }

        #status-display {
            font-size: 12px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 30px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            letter-spacing: 1.5px;
            display: inline-block;
            text-transform: uppercase;
        }

        .dashboard-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .counter-section {
            text-align: center;
            margin-bottom: 20px;
        }

        .counter-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #counter {
            font-size: 72px;
            font-weight: 800;
            color: var(--text-main);
            line-height: 1;
            margin: 8px 0 16px 0;
        }

        .timer-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 20px;
            display: flex;
            gap: 24px;
            align-items: center;
            margin-bottom: 20px;
        }

        .timer-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .timer-title {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        #stopwatch {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-cyan);
            font-variant-numeric: tabular-nums;
        }

        #avg-display {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            font-variant-numeric: tabular-nums;
        }

        #tap-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: white;
            font-size: 24px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            transition: all 0.15s ease;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
        }

        #tap-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 28px rgba(99, 102, 241, 0.5);
        }

        #tap-btn:active {
            transform: scale(0.96) translateY(0);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        button.action-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background 0.2s, border-color 0.2s;
        }

        button.action-btn:hover {
            background: #273548;
            border-color: #334155;
        }

        .panel-container {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-bottom: 16px;
            box-sizing: border-box;
        }

        .panel-header {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }

        .panel-header:hover {
            color: var(--text-main);
        }

        .toggle-icon {
            font-family: monospace;
            font-size: 14px;
            background: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent-cyan);
        }

        .panel-content {
            margin-top: 12px;
            max-height: 220px;
            overflow-y: auto;
        }

        .collapsed .panel-content {
            display: none;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(34, 52, 74, 0.6);
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-duration {
            color: var(--accent-cyan);
            font-weight: 700;
        }

        .break-log {
            color: #f59e0b;
        }

        #summary-panel {
            display: none;
            border-left: 4px solid #10b981;
            background: #0f172a;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 6px 0;
            color: #e2e8f0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .summary-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="app-header">
        <h2>3DR Task Counter</h2>
        <div id="status-display">Shift Not Started</div>
    </div>

    <!-- Main Control Dashboard Card -->
    <div class="dashboard-card">
        <div class="counter-section">
            <span class="counter-label">Tasks Completed</span>
            <div id="counter">0</div>
        </div>

        <div class="timer-box">
            <div class="timer-group">
                <span class="timer-title">Active Time</span>
                <div id="stopwatch">00:00:00</div>
            </div>
            <div style="width: 1px; height: 24px; background: var(--border-color);"></div>
            <div class="timer-group">
                <span class="timer-title">Avg Interval</span>
                <div id="avg-display">--</div>
            </div>
        </div>

        <button id="tap-btn" onclick="tap()">TAP</button>

        <div class="btn-group">
            <button class="action-btn" onclick="toggleBreakOrStart()" id="break-start-btn" style="grid-column: span 2; background: #312e81; border-color: #4338ca;">Start Shift</button>
            <button class="action-btn" onclick="endShiftReport()">End Shift</button>
            <button class="action-btn" onclick="copyData()">Copy Data</button>
            <button class="action-btn" onclick="downloadCSV()" style="grid-column: span 2;">Download CSV Report</button>
        </div>
    </div>

    <!-- Shift Summary Display Panel -->
    <div class="panel-container collapsed" id="summary-panel">
        <div class="panel-header" style="color: #10b981;" onclick="togglePanel(this)">
            <span>LATEST SHIFT SUMMARY REPORT</span>
            <span class="toggle-icon">[+]</span>
        </div>
        <div class="panel-content">
            <div class="summary-row"><span>Total Tasks:</span> <strong id="sum-tasks">0</strong></div>
            <div class="summary-row"><span>Active Time:</span> <strong id="sum-time">00:00:00</strong></div>
            <div class="summary-row"><span>Avg Interval:</span> <strong id="sum-avg">--</strong></div>
            <div class="summary-row"><span>Completed At:</span> <strong id="sum-ended">--</strong></div>
        </div>
    </div>

    <!-- Shift History Panel -->
    <div class="panel-container collapsed">
        <div class="panel-header" onclick="togglePanel(this)">
            <span>SHIFT HISTORY</span>
            <span class="toggle-icon">[+]</span>
        </div>
        <div class="panel-content">
            <div id="history-list"><span style="font-size: 12px; color: var(--text-muted);">No completed shifts recorded yet.</span></div>
        </div>
    </div>

    <!-- Tap Logs Panel -->
    <div class="panel-container">
        <div class="panel-header" onclick="togglePanel(this)">
            <span>LIVE TAP LOG (NEWEST FIRST)</span>
            <span class="toggle-icon">[-]</span>
        </div>
        <div class="panel-content">
            <div id="log-list"><span style="font-size: 12px; color: var(--text-muted);">No logs yet.</span></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/library/d/13B9QoWM8mUj1ClmkOOUmRARDYAMxoRbyK1rj68ddzRcJNJuPK90TMoAn/1"; 

        let count = 0;
        let logs = [];
        let shiftHistory = JSON.parse(localStorage.getItem('3dr_shift_history')) || [];
        let isStarted = false;
        let isBreak = false;
        
        let timerInterval = setInterval(updateActiveTimerDisplay, 250);

        loadActiveSession();
        renderHistory();

        function togglePanel(headerEl) {
            const container = headerEl.parentElement;
            container.classList.toggle('collapsed');
            const icon = headerEl.querySelector('.toggle-icon');
            icon.innerText = container.classList.contains('collapsed') ? '[+]' : '[-]';
        }

        function saveActiveSession() {
            const sessionData = { count, logs, isStarted, isBreak };
            localStorage.setItem('3dr_active_session', JSON.stringify(sessionData));
        }

        function loadActiveSession() {
            const savedSession = localStorage.getItem('3dr_active_session');
            if (savedSession) {
                try {
                    const session = JSON.parse(savedSession);
                    count = session.count || 0;
                    logs = session.logs || [];
                    isStarted = session.isStarted || false;
                    isBreak = session.isBreak || false;

                    document.getElementById('counter').innerText = count;
                    updateStatusUI();
                    
                    const btn = document.getElementById('break-start-btn');
                    if (!isStarted) {
                        btn.innerText = "Start Shift";
                        btn.style.background = "#312e81";
                        btn.style.borderColor = "#4338ca";
                    } else if (isBreak) {
                        btn.innerText = "Resume";
                        btn.style.background = "#14532d";
                        btn.style.borderColor = "#166534";
                    } else {
                        btn.innerText = "Start Break";
                        btn.style.background = "#78350f";
                        btn.style.borderColor = "#92400e";
                    }
                    updateActiveTimerDisplay();
                    renderLogs();
                } catch (e) {
                    console.error("Failed to restore session", e);
                }
            }
        }

        function calculateTotalActiveMs() {
            if (!isStarted || logs.length === 0) return 0;

            let totalActiveMs = 0;
            let currentTimeMs = Date.now();
            let workingSegmentEnd = currentTimeMs;

            if (isBreak) {
                for (let l of logs) {
                    if (l.type === 'break_start') {
                        workingSegmentEnd = new Date(l.timestamp).getTime();
                        break;
                    }
                }
            }

            let chronologicalLogs = [...logs].reverse();
            let activeSegmentStart = null;

            for (let log of chronologicalLogs) {
                let logTime = new Date(log.timestamp).getTime();
                if (log.type === 'start' || log.type === 'break_end') {
                    activeSegmentStart = logTime;
                } else if (log.type === 'break_start' && activeSegmentStart !== null) {
                    totalActiveMs += (logTime - activeSegmentStart);
                    activeSegmentStart = null;
                }
            }

            if (activeSegmentStart !== null && activeSegmentStart < workingSegmentEnd) {
                totalActiveMs += (workingSegmentEnd - activeSegmentStart);
            }

            return Math.max(0, totalActiveMs);
        }

        function updateActiveTimerDisplay() {
            if (isStarted) {
                let activeMs = calculateTotalActiveMs();
                let totalSec = Math.floor(activeMs / 1000);
                let hours = String(Math.floor(totalSec / 3600)).padStart(2, '0');
                let minutes = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
                let seconds = String(totalSec % 60).padStart(2, '0');
                document.getElementById('stopwatch').innerText = `${hours}:${minutes}:${seconds}`;
                
                if (!isBreak) {
                    saveActiveSession();
                }
            }
        }

        function getFormattedActiveTime() {
            let activeMs = calculateTotalActiveMs();
            let totalSec = Math.floor(activeMs / 1000);
            let hours = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            let minutes = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            let seconds = String(totalSec % 60).padStart(2, '0');
            return `${hours}h ${minutes}m ${seconds}s`;
        }

        function updateStatusUI() {
            const statusEl = document.getElementById('status-display');
            if (!isStarted) {
                statusEl.innerText = "Shift Not Started";
                statusEl.style.color = "var(--text-muted)";
            } else if (isBreak) {
                statusEl.innerText = "On Break";
                statusEl.style.color = "#f59e0b";
            } else {
                statusEl.innerText = "On Task";
                statusEl.style.color = "var(--accent-cyan)";
            }
        }

        function formatDuration(ms) {
            if (ms < 0) return "0s";
            let seconds = Math.floor(ms / 1000);
            let mins = Math.floor(seconds / 60);
            let hrs = Math.floor(mins / 60);
            seconds = seconds % 60;
            mins = mins % 60;
            
            if (hrs > 0) return `${hrs}h ${mins}m ${seconds}s`;
            if (mins > 0) return `${mins}m ${seconds}s`;
            return `${seconds}s`;
        }

        function getActiveDurationBetween(laterLogTimeMs, earlierLogTimeMs) {
            let totalDiffMs = laterLogTimeMs - earlierLogTimeMs;
            for (let i = 0; i < logs.length; i++) {
                if (logs[i].type === 'break_start') {
                    let breakStartMs = new Date(logs[i].timestamp).getTime();
                    for (let j = i - 1; j >= 0; j--) {
                        if (logs[j].type === 'break_end') {
                            let breakEndMs = new Date(logs[j].timestamp).getTime();
                            if (breakStartMs >= earlierLogTimeMs && breakEndMs <= laterLogTimeMs) {
                                totalDiffMs -= (breakEndMs - breakStartMs);
                            }
                            break;
                        }
                    }
                }
            }
            return Math.max(0, totalDiffMs);
        }

        function calculateAverageInterval() {
            let tapLogs = logs.filter(l => l.type === 'tap');
            if (tapLogs.length < 2) return "--";

            let totalDiff = 0;
            for (let i = 0; i < tapLogs.length - 1; i++) {
                const currentMs = new Date(tapLogs[i].timestamp).getTime();
                const prevMs = new Date(tapLogs[i+1].timestamp).getTime();
                totalDiff += getActiveDurationBetween(currentMs, prevMs);
            }
            let avgMs = totalDiff / (tapLogs.length - 1);
            let totalSec = Math.floor(avgMs / 1000);
            let m = Math.floor(totalSec / 60);
            let s = totalSec % 60;
            return `${m}m ${s}s`;
        }

        function toggleBreakOrStart() {
            const btn = document.getElementById('break-start-btn');
            
            if (!isStarted) {
                isStarted = true;
                isBreak = false;
                const now = new Date();
                logs.unshift({ type: 'start', timestamp: now.toISOString(), formattedTime: now.toLocaleString() });
                btn.innerText = "Start Break";
                btn.style.background = "#78350f";
                btn.style.borderColor = "#92400e";
                updateStatusUI();
                renderLogs();
                saveActiveSession();
                return;
            }

            if (!isBreak) {
                let finished = confirm("Have you already finished the task?");
                if (!finished) return;
                isBreak = true;
                const now = new Date();
                logs.unshift({ type: 'break_start', timestamp: now.toISOString(), formattedTime: now.toLocaleString() });
                btn.innerText = "Resume";
                btn.style.background = "#14532d";
                btn.style.borderColor = "#166534";
                updateStatusUI();
                renderLogs();
                saveActiveSession();
            } else {
                isBreak = false;
                const now = new Date();
                logs.unshift({ type: 'break_end', timestamp: now.toISOString(), formattedTime: now.toLocaleString() });
                btn.innerText = "Start Break";
                btn.style.background = "#78350f";
                btn.style.borderColor = "#92400e";
                updateStatusUI();
                renderLogs();
                saveActiveSession();
            }
        }

        function tap() {
            if (!isStarted) {
                isStarted = true;
                isBreak = false;
                const nowStart = new Date();
                logs.unshift({ type: 'start', timestamp: nowStart.toISOString(), formattedTime: nowStart.toLocaleString() });
                const btn = document.getElementById('break-start-btn');
                btn.innerText = "Start Break";
                btn.style.background = "#78350f";
                btn.style.borderColor = "#92400e";
                updateStatusUI();
                renderLogs();
                saveActiveSession();
                return;
            }

            if (isBreak) {
                isBreak = false;
                const nowBreakEnd = new Date();
                logs.unshift({ type: 'break_end', timestamp: nowBreakEnd.toISOString(), formattedTime: nowBreakEnd.toLocaleString() });
                const btn = document.getElementById('break-start-btn');
                btn.innerText = "Start Break";
                btn.style.background = "#78350f";
                btn.style.borderColor = "#92400e";
                updateStatusUI();
                renderLogs();
                saveActiveSession();
                return; 
            }

            count++;
            document.getElementById('counter').innerText = count;
            const now = new Date();
            logs.unshift({ type: 'tap', id: count, timestamp: now.toISOString(), formattedTime: now.toLocaleString() });

            updateStatusUI();
            renderLogs();
            saveActiveSession();
        }

        function syncToGoogleSheets(shiftData) {
            if (WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) return;
            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(shiftData)
            }).catch(err => console.error("Cloud sync error:", err));
        }

        function endShiftReport() {
            if (!isStarted) {
                alert("Shift has not been started yet!");
                return;
            }

            let avg = calculateAverageInterval();
            let activeTime = getFormattedActiveTime();
            let endedTime = new Date().toLocaleString();

            document.getElementById('sum-tasks').innerText = count;
            document.getElementById('sum-time').innerText = activeTime;
            document.getElementById('sum-avg').innerText = avg;
            document.getElementById('sum-ended').innerText = endedTime;
            
            const summaryPanel = document.getElementById('summary-panel');
            summaryPanel.style.display = "block";
            summaryPanel.classList.remove('collapsed');
            summaryPanel.querySelector('.toggle-icon').innerText = '[-]';

            const currentShiftData = {
                shiftNumber: shiftHistory.length + 1,
                tasks: count,
                activeTime: activeTime,
                avgInterval: avg,
                endedAt: endedTime,
                logs: logs
            };

            shiftHistory.unshift(currentShiftData);
            localStorage.setItem('3dr_shift_history', JSON.stringify(shiftHistory));
            renderHistory();
            syncToGoogleSheets(currentShiftData);

            localStorage.removeItem('3dr_active_session');
            resetCounter();
        }

        function renderLogs() {
            const logList = document.getElementById('log-list');
            logList.innerHTML = "";

            if (logs.length === 0) {
                logList.innerHTML = `<span style="font-size: 12px; color: var(--text-muted);">No logs yet.</span>`;
                return;
            }

            logs.forEach((log, index) => {
                let durationStr = "Start";
                if (index < logs.length - 1) {
                    const currentMs = new Date(log.timestamp).getTime();
                    const prevMs = new Date(logs[index + 1].timestamp).getTime();
                    durationStr = "+" + formatDuration(getActiveDurationBetween(currentMs, prevMs));
                }

                const item = document.createElement('div');
                item.className = 'log-item';

                if (log.type === 'tap') {
                    item.innerHTML = `<span><strong>#${log.id}</strong> ${log.formattedTime}</span><span class="log-duration">${durationStr}</span>`;
                } else if (log.type === 'start') {
                    item.innerHTML = `<span>Start Of Shift ${log.formattedTime}</span><span style="color: var(--text-muted);">Start</span>`;
                } else if (log.type === 'break_start') {
                    item.innerHTML = `<span class="break-log">[Break] ${log.formattedTime}</span><span style="color: #f59e0b;">Break</span>`;
                } else if (log.type === 'break_end') {
                    item.innerHTML = `<span class="break-log">[Resume] ${log.formattedTime}</span><span style="color: #10b981;">Resumed</span>`;
                }
                logList.appendChild(item);
            });

            document.getElementById('avg-display').innerText = calculateAverageInterval();
        }

        function renderHistory() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = "";

            if (shiftHistory.length === 0) {
                historyList.innerHTML = `<span style="font-size: 12px; color: var(--text-muted);">No completed shifts recorded yet.</span>`;
                return;
            }

            shiftHistory.forEach((shift, index) => {
                const item = document.createElement('div');
                item.className = 'log-item';
                item.innerHTML = `<span><strong>Shift #${shiftHistory.length - index}</strong> (${shift.endedAt})</span><span style="color: var(--accent-cyan);">Tasks: ${shift.tasks} | Time: ${shift.activeTime}</span>`;
                historyList.appendChild(item);
            });
        }

        function resetCounter() {
            count = 0;
            logs = [];
            document.getElementById('counter').innerText = count;
            document.getElementById('stopwatch').innerText = "00:00:00";
            document.getElementById('avg-display').innerText = "--";
            
            const btn = document.getElementById('break-start-btn');
            btn.innerText = "Start Shift";
            btn.style.background = "#312e81";
            btn.style.borderColor = "#4338ca";
            
            isStarted = false;
            isBreak = false;
            updateStatusUI();
            renderLogs();
        }

        function copyData() {
            let data = "Log Type,ID/Label,Timestamp,Duration From Previous\n";
            logs.forEach((log, index) => {
                let durationStr = "Start";
                if (index < logs.length - 1) {
                    durationStr = formatDuration(getActiveDurationBetween(new Date(log.timestamp).getTime(), new Date(logs[index + 1].timestamp).getTime()));
                }
                let label = log.type === 'tap' ? `#${log.id}` : log.type;
                data += `${log.type},${label},${log.formattedTime},${durationStr}\n`;
            });
            navigator.clipboard.writeText(data).then(() => alert("Data copied to clipboard!"));
        }

        function downloadCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Log Type,ID/Label,Timestamp,Duration From Previous\n";
            logs.forEach((log, index) => {
                let durationStr = "Start";
                if (index < logs.length - 1) {
                    durationStr = formatDuration(getActiveDurationBetween(new Date(log.timestamp).getTime(), new Date(logs[index + 1].timestamp).getTime()));
                }
                let label = log.type === 'tap' ? `#${log.id}` : log.type;
                csvContent += `${log.type},${label},"${log.formattedTime}",${durationStr}\n`;
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", "tap_logs_dynamic.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
