<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DR Task Counter</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h2 {
            letter-spacing: 2px;
            color: #e0e1dd;
            margin-bottom: 5px;
        }
        #counter {
            font-size: 64px;
            font-weight: bold;
            margin: 5px 0;
        }
        #status-display {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 4px 12px;
            border-radius: 20px;
            background: #1e293b;
            border: 1px solid #475569;
            color: #94a3b8;
            letter-spacing: 1px;
        }
        .timer-info {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 5px;
        }
        #stopwatch {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 15px;
        }
        .avg-info {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 25px;
        }
        #tap-btn {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: #6366f1;
            color: white;
            font-size: 22px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            transition: transform 0.1s ease;
            margin-bottom: 20px;
        }
        #tap-btn:active {
            transform: scale(0.95);
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button.action-btn {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        button.action-btn:hover {
            background: #334155;
        }
        .panel-container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }
        .panel-header {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 1px;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .panel-header:hover {
            color: #cbd5e1;
        }
        .panel-content {
            margin-top: 10px;
        }
        .collapsed .panel-content {
            display: none;
        }
        .collapsed .panel-header {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }
        .log-item {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }
        .log-item:last-child {
            border-bottom: none;
        }
        .log-duration {
            color: #38bdf8;
            font-weight: bold;
        }
        .break-log {
            color: #eab308;
        }
        #summary-panel {
            display: none;
            border-left: 4px solid #22c55e;
            background: #0f172a;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            padding: 5px 0;
            color: #e2e8f0;
        }
    </style>
</head>
<body>

    <h2>3DR TASK COUNTER</h2>
    <div id="counter">0</div>
    <div id="status-display">SHIFT NOT STARTED</div>
    <div class="timer-info">Active Time</div>
    <div id="stopwatch">00:00:00</div>
    <div class="avg-info" id="avg-display">Avg Interval: --</div>

    <button id="tap-btn" onclick="tap()">TAP</button>

    <div class="btn-group">
        <button class="action-btn" onclick="toggleBreakOrStart()" id="break-start-btn">Start Shift</button>
        <button class="action-btn" onclick="endShiftReport()">End Of Shift</button>
        <button class="action-btn" onclick="copyData()">Copy Data</button>
        <button class="action-btn" onclick="downloadCSV()">Download CSV</button>
    </div>

    <!-- Shift Summary Display Panel (Collapsible) -->
    <div class="panel-container collapsed" id="summary-panel">
        <div class="panel-header" style="color: #22c55e;" onclick="togglePanel(this)">
            <span>LATEST SHIFT SUMMARY REPORT</span>
            <span class="toggle-icon">[+]</span>
        </div>
        <div class="panel-content">
            <div class="summary-row"><span>Total Tasks Made:</span> <strong id="sum-tasks">0</strong></div>
            <div class="summary-row"><span>Total Active Time:</span> <strong id="sum-time">00:00:00</strong></div>
            <div class="summary-row"><span>Average Interval:</span> <strong id="sum-avg">--</strong></div>
            <div class="summary-row"><span>Completed At:</span> <strong id="sum-ended">--</strong></div>
        </div>
    </div>

    <!-- Shift History Panel (Collapsible) -->
    <div class="panel-container collapsed">
        <div class="panel-header" onclick="togglePanel(this)">
            <span>SHIFT HISTORY</span>
            <span class="toggle-icon">[+]</span>
        </div>
        <div class="panel-content">
            <div id="history-list"><span style="font-size: 13px; color: #64748b;">No completed shifts recorded yet.</span></div>
        </div>
    </div>

    <!-- Tap Logs Panel (Collapsible) -->
    <div class="panel-container">
        <div class="panel-header" onclick="togglePanel(this)">
            <span>TAP LOG (NEWEST FIRST)</span>
            <span class="toggle-icon">[-]</span>
        </div>
        <div class="panel-content">
            <div id="log-list"><span style="font-size: 13px; color: #64748b;">No logs yet.</span></div>
        </div>
    </div>

    <script>
        // ==========================================
        // GOOGLE SHEETS WEB APP URL CONFIGURATION
        // ==========================================
        const WEB_APP_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE"; 
        // Paste your deployed Google Apps Script Web App URL between the quotes above.

        let count = 0;
        let logs = [];
        let shiftHistory = JSON.parse(localStorage.getItem('3dr_shift_history')) || [];
        let isStarted = false;
        let isBreak = false;
        
        let timerInterval = setInterval(updateActiveTimerDisplay, 250);

        loadActiveSession();
        renderHistory();

        function togglePanel(headerEl) {
            const container = headerEl.parentElement;
            container.classList.toggle('collapsed');
            const icon = headerEl.querySelector('.toggle-icon');
            icon.innerText = container.classList.contains('collapsed') ? '[+]' : '[-]';
        }

        function saveActiveSession() {
            const sessionData = { count, logs, isStarted, isBreak };
            localStorage.setItem('3dr_active_session', JSON.stringify(sessionData));
        }

        function loadActiveSession() {
            const savedSession = localStorage.getItem('3dr_active_session');
            if (savedSession) {
                try {
                    const session = JSON.parse(savedSession);
                    count = session.count || 0;
                    logs = session.logs || [];
                    isStarted = session.isStarted || false;
                    isBreak = session.isBreak || false;

                    document.getElementById('counter').innerText = count;
                    updateStatusUI();
                    
                    const btn = document.getElementById('break-start-btn');
                    if (!isStarted) {
                        btn.innerText = "Start Shift";
                        btn.style.borderColor = "#475569";
                    } else if (isBreak) {
                        btn.innerText = "Resume";
                        btn.style.borderColor = "#22c55e";
                    } else {
                        btn.innerText = "Start Break";
                        btn.style.borderColor = "#475569";
                    }
                    updateActiveTimerDisplay();
                    renderLogs();
                } catch (e) {
                    console.error("Failed to restore session", e);
                }
            }
        }

        function calculateTotalActiveMs() {
            if (!isStarted || logs.length === 0) return 0;

            let totalActiveMs = 0;
            let currentTimeMs = Date.now();
            let workingSegmentEnd = currentTimeMs;

            if (isBreak) {
                for (let l of logs) {
                    if (l.type === 'break_start') {
                        workingSegmentEnd = new Date(l.timestamp).getTime();
                        break;
                    }
                }
            }

            let chronologicalLogs = [...logs].reverse();
            let activeSegmentStart = null;

            for (let log of chronologicalLogs) {
                let logTime = new Date(log.timestamp).getTime();
                if (log.type === 'start' || log.type === 'break_end') {
                    activeSegmentStart = logTime;
                } else if (log.type === 'break_start' && activeSegmentStart !== null) {
                    totalActiveMs += (logTime - activeSegmentStart);
                    activeSegmentStart = null;
                }
            }

            if (activeSegmentStart !== null && activeSegmentStart < workingSegmentEnd) {
                totalActiveMs += (workingSegmentEnd - activeSegmentStart);
            }

            return Math.max(0, totalActiveMs);
        }

        function updateActiveTimerDisplay() {
            if (isStarted) {
                let activeMs = calculateTotalActiveMs();
                let totalSec = Math.floor(activeMs / 1000);
                let hours = String(Math.floor(totalSec / 3600)).padStart(2, '0');
                let minutes = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
                let seconds = String(totalSec % 60).padStart(2, '0');
                document.getElementById('stopwatch').innerText = `${hours}:${minutes}:${seconds}`;
                
                if (!isBreak) {
                    saveActiveSession();
                }
            }
        }

        function getFormattedActiveTime() {
            let activeMs = calculateTotalActiveMs();
            let totalSec = Math.floor(activeMs / 1000);
            let hours = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            let minutes = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            let seconds = String(totalSec % 60).padStart(2, '0');
            return `${hours}h ${minutes}m ${seconds}s`;
        }

        function updateStatusUI() {
            const statusEl = document.getElementById('status-display');
            if (!isStarted) {
                statusEl.innerText = "SHIFT NOT STARTED";
                statusEl.style.color = "#94a3b8";
                statusEl.style.borderColor = "#475569";
            } else if (isBreak) {
                statusEl.innerText = "ON BREAK";
                statusEl.style.color = "#eab308";
                statusEl.style.borderColor = "#eab308";
            } else {
                statusEl.innerText = "ON TASK";
                statusEl.style.color = "#38bdf8";
                statusEl.style.borderColor = "#38bdf8";
            }
        }

        function formatDuration(ms) {
            if (ms < 0) return "0s";
            let seconds = Math.floor(ms / 1000);
            let mins = Math.floor(seconds / 60);
            let hrs = Math.floor(mins / 60);
            seconds = seconds % 60;
            mins = mins % 60;
            
            if (hrs > 0) {
                return `${hrs}h ${mins}m ${seconds}s`;
            } else if (mins > 0) {
                return `${mins}m ${seconds}s`;
            } else {
                return `${seconds}s`;
            }
        }

        function getActiveDurationBetween(laterLogTimeMs, earlierLogTimeMs) {
            let totalDiffMs = laterLogTimeMs - earlierLogTimeMs;
            
            for (let i = 0; i < logs.length; i++) {
                if (logs[i].type === 'break_start') {
                    let breakStartMs = new Date(logs[i].timestamp).getTime();
                    
                    for (let j = i - 1; j >= 0; j--) {
                        if (logs[j].type === 'break_end') {
                            let breakEndMs = new Date(logs[j].timestamp).getTime();
                            
                            if (breakStartMs >= earlierLogTimeMs && breakEndMs <= laterLogTimeMs) {
                                totalDiffMs -= (breakEndMs - breakStartMs);
                            }
                            break;
                        }
                    }
                }
            }
            return Math.max(0, totalDiffMs);
        }

        function calculateAverageInterval() {
            let tapLogs = logs.filter(l => l.type === 'tap');
            if (tapLogs.length < 2) return "--";

            let totalDiff = 0;
            for (let i = 0; i < tapLogs.length - 1; i++) {
                const currentMs = new Date(tapLogs[i].timestamp).getTime();
                const prevMs = new Date(tapLogs[i+1].timestamp).getTime();
                totalDiff += getActiveDurationBetween(currentMs, prevMs);
            }
            let avgMs = totalDiff / (tapLogs.length - 1);
            let totalSec = Math.floor(avgMs / 1000);
            let m = Math.floor(totalSec / 60);
            let s = totalSec % 60;
            return `${m}m ${s}s`;
        }

        function toggleBreakOrStart() {
            const btn = document.getElementById('break-start-btn');
            
            if (!isStarted) {
                isStarted = true;
                isBreak = false;
                const now = new Date();
                logs.unshift({
                    type: 'start',
                    timestamp: now.toISOString(),
                    formattedTime: now.toLocaleString()
                });
                btn.innerText = "Start Break";
                btn.style.borderColor = "#475569";
                updateStatusUI();
                renderLogs();
                saveActiveSession();
                return;
            }

            if (!isBreak) {
                let finished = confirm("Have you already finished the task?");
                const now = new Date();

                if (finished) {
                    isBreak = true;
                    logs.unshift({
                        type: 'break_start',
                        timestamp: now.toISOString(),
                        formattedTime: now.toLocaleString()
                    });
                    btn.innerText = "Resume";
                    btn.style.borderColor = "#22c55e";
                    updateStatusUI();
                    renderLogs();
                    saveActiveSession();
                } else {
                    return;
                }
            } else {
                isBreak = false;
                const now = new Date();
                logs.unshift({
                    type: 'break_end',
                    timestamp: now.toISOString(),
                    formattedTime: now.toLocaleString()
                });
                btn.innerText = "Start Break";
                btn.style.borderColor = "#475569";
                updateStatusUI();
                renderLogs();
                saveActiveSession();
            }
        }

        function tap() {
            if (!isStarted) {
                isStarted = true;
                isBreak = false;
                const nowStart = new Date();
                logs.unshift({
                    type: 'start',
                    timestamp: nowStart.toISOString(),
                    formattedTime: nowStart.toLocaleString()
                });
                const btn = document.getElementById('break-start-btn');
                btn.innerText = "Start Break";
                btn.style.borderColor = "#475569";
                updateStatusUI();
                renderLogs();
                saveActiveSession();
                return;
            }

            if (isBreak) {
                isBreak = false;
                const nowBreakEnd = new Date();
                logs.unshift({
                    type: 'break_end',
                    timestamp: nowBreakEnd.toISOString(),
                    formattedTime: nowBreakEnd.toLocaleString()
                });
                const btn = document.getElementById('break-start-btn');
                btn.innerText = "Start Break";
                btn.style.borderColor = "#475569";
                updateStatusUI();
                renderLogs();
                saveActiveSession();
                return; 
            }

            count++;
            document.getElementById('counter').innerText = count;
            
            const now = new Date();
            logs.unshift({
                type: 'tap',
                id: count,
                timestamp: now.toISOString(),
                formattedTime: now.toLocaleString()
            });

            updateStatusUI();
            renderLogs();
            saveActiveSession();
        }

        function syncToGoogleSheets(shiftData) {
            if (WEB_APP_URL.includes("YOUR_GOOGLE_APPS_SCRIPT")) {
                console.warn("Google Apps Script URL not configured yet.");
                return;
            }

            fetch(WEB_APP_URL, {
                method: "POST",
                mode: "no-cors", // Required for Google Apps Script web apps
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(shiftData)
            }).then(() => {
                console.log("Shift automatically synced to Google Sheets!");
            }).catch(err => {
                console.error("Cloud sync error:", err);
            });
        }

        function endShiftReport() {
            if (!isStarted) {
                alert("Shift has not been started yet!");
                return;
            }

            let avg = calculateAverageInterval();
            let activeTime = getFormattedActiveTime();
            let endedTime = new Date().toLocaleString();

            document.getElementById('sum-tasks').innerText = count;
            document.getElementById('sum-time').innerText = activeTime;
            document.getElementById('sum-avg').innerText = avg;
            document.getElementById('sum-ended').innerText = endedTime;
            
            const summaryPanel = document.getElementById('summary-panel');
            summaryPanel.style.display = "block";
            summaryPanel.classList.remove('collapsed');
            summaryPanel.querySelector('.toggle-icon').innerText = '[-]';

            const currentShiftData = {
                shiftNumber: shiftHistory.length + 1,
                tasks: count,
                activeTime: activeTime,
                avgInterval: avg,
                endedAt: endedTime,
                logs: logs
            };

            shiftHistory.unshift(currentShiftData);
            localStorage.setItem('3dr_shift_history', JSON.stringify(shiftHistory));
            renderHistory();

            // Seamlessly and automatically push to Google Drive / Sheets in the background!
            syncToGoogleSheets(currentShiftData);

            localStorage.removeItem('3dr_active_session');
            resetCounter();
        }

        function renderLogs() {
            const logList = document.getElementById('log-list');
            logList.innerHTML = "";

            if (logs.length === 0) {
                logList.innerHTML = `<span style="font-size: 13px; color: #64748b;">No logs yet.</span>`;
                return;
            }

            logs.forEach((log, index) => {
                let durationStr = "Start";
                if (index < logs.length - 1) {
                    const currentMs = new Date(log.timestamp).getTime();
                    const prevMs = new Date(logs[index + 1].timestamp).getTime();
                    const activeDiffMs = getActiveDurationBetween(currentMs, prevMs);
                    durationStr = "+" + formatDuration(activeDiffMs);
                }

                const item = document.createElement('div');
                item.className = 'log-item';

                if (log.type === 'tap') {
                    item.innerHTML = `
                        <span><strong>#${log.id}</strong> ${log.formattedTime}</span>
                        <span class="log-duration">${durationStr}</span>
                    `;
                } else if (log.type === 'start') {
                    item.innerHTML = `
                        <span>Start Of Shift ${log.formattedTime}</span>
                        <span style="color: #94a3b8;">Start</span>
                    `;
                } else if (log.type === 'break_start') {
                    item.innerHTML = `
                        <span class="break-log">[Break] ${log.formattedTime}</span>
                        <span style="color: #eab308;">Break Start</span>
                    `;
                } else if (log.type === 'break_end') {
                    item.innerHTML = `
                        <span class="break-log">[Resume] ${log.formattedTime}</span>
                        <span style="color: #22c55e;">Resumed</span>
                    `;
                }
                logList.appendChild(item);
            });

            document.getElementById('avg-display').innerText = `Avg Interval: ${calculateAverageInterval()}`;
        }

        function renderHistory() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = "";

            if (shiftHistory.length === 0) {
                historyList.innerHTML = `<span style="font-size: 13px; color: #64748b;">No completed shifts recorded yet.</span>`;
                return;
            }

            shiftHistory.forEach((shift, index) => {
                const item = document.createElement('div');
                item.className = 'log-item';
                item.innerHTML = `
                    <span><strong>Shift #${shiftHistory.length - index}</strong> (${shift.endedAt})</span>
                    <span style="color: #38bdf8;">Tasks: ${shift.tasks} | Time: ${shift.activeTime} | Avg: ${shift.avgInterval}</span>
                `;
                historyList.appendChild(item);
            });
        }

        function resetCounter() {
            count = 0;
            logs = [];
            document.getElementById('counter').innerText = count;
            document.getElementById('stopwatch').innerText = "00:00:00";
            document.getElementById('avg-display').innerText = "Avg Interval: --";
            
            const btn = document.getElementById('break-start-btn');
            btn.innerText = "Start Shift";
            btn.style.borderColor = "#475569";
            
            isStarted = false;
            isBreak = false;
            updateStatusUI();
            renderLogs();
        }

        function copyData() {
            let data = "Log Type,ID/Label,Timestamp,Duration From Previous\n";
            logs.forEach((log, index) => {
                let durationStr = "Start";
                if (index < logs.length - 1) {
                    const currentMs = new Date(log.timestamp).getTime();
                    const prevMs = new Date(logs[index + 1].timestamp).getTime();
                    const activeDiffMs = getActiveDurationBetween(currentMs, prevMs);
                    durationStr = formatDuration(activeDiffMs);
                }
                let label = log.type === 'tap' ? `#${log.id}` : log.type;
                data += `${log.type},${label},${log.formattedTime},${durationStr}\n`;
            });
            navigator.clipboard.writeText(data).then(() => {
                alert("Data copied to clipboard!");
            });
        }

        function downloadCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Log Type,ID/Label,Timestamp,Duration From Previous\n";
            logs.forEach((log, index) => {
                let durationStr = "Start";
                if (index < logs.length - 1) {
                    const currentMs = new Date(log.timestamp).getTime();
                    const prevMs = new Date(logs[index + 1].timestamp).getTime();
                    const activeDiffMs = getActiveDurationBetween(currentMs, prevMs);
                    durationStr = formatDuration(activeDiffMs);
                }
                let label = log.type === 'tap' ? `#${log.id}` : log.type;
                csvContent += `${log.type},${label},"${log.formattedTime}",${durationStr}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "tap_logs_dynamic.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
